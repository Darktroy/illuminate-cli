memory_limit = -1
error_reporting = E_ALL
display_errors = On
display_startup_errors = On

; required by Laravel Zero `app:build` (Box creates a PHAR)
phar.readonly = Off

date.timezone = Africa/Cairo

; xdebug is enabled but idle unless XDEBUG_MODE is set (debug, coverage, ...)
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
